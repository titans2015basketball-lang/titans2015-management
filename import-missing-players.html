function detectSeason(date) {
  if (!date || date==='nan') return 'Άγνωστο';
  const y = parseInt(date.substring(0,4));
  const m = parseInt(date.substring(5,7));
  const sy = m >= 9 ? y : y-1;
  return sy + '-' + String(sy+1).slice(-2);
}

function detectType(desc) {
  const d = (desc||'').toLowerCase();
  const types = [];
  if (d.includes('πρωτ')) types.push('πρωτάθλημα');
  if (d.includes('κυπελ') || d.includes('κυπ')) types.push('κύπελλο');
  if (d.includes('δελτ')) types.push('δελτίο');
  if (d.includes('εμφαν') || d.includes('warm')) types.push('εμφάνιση');

  if (d.includes('summer')) types.push('summer');
  return types.join(',') || 'άλλο';
}

async function startImport() {
  document.getElementById('btn').disabled = true;
  log('🚀 Ξεκινά δημιουργία παικτών...', 'info');

  let created = 0, historyUpdated = 0, errors = 0;

  for (const player of MISSING_PLAYERS) {
    try {
      // Create player
      const playerId = uid();
      await db.collection('players').doc(playerId).set({
        name: player.name,
        jersey: player.jersey || '',
        status: 'inactive',
        phone: '',
        email: ''
      });
      created++;
      log(`✅ Παίκτης: ${player.name}`, 'ok');

      // Find history for this player
      const normName = player.name.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      for (const [histName, payments] of Object.entries(HISTORY)) {
        const normHist = histName.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        const p1 = normName.split(' ')[0];
        const p2 = normHist.split(' ')[0];
        if (p1 === p2) {
          const records = payments.map(p => ({
            date: p.date,
            amount: p.amount,
            description: p.description,
            season: detectSeason(p.date),
            type: detectType(p.description)
          }));
          const totalAmt = records.reduce((s,r) => s + (r.amount||0), 0);
          await db.collection('history').doc(playerId).set({
            playerId,
            playerName: player.name,
            totalAmount: totalAmt,
            lastUpdated: new Date().toISOString(),
            records
          });
          historyUpdated++;
          log(`  📋 Ιστορικό: ${records.length} εγγρ. | ${totalAmt.toFixed(0)}€`, 'info');
          break;
        }
      }
    } catch(e) {
      errors++;
      log(`❌ ${player.name}: ${e.message}`, 'err');
    }
  }

  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
  log(`🏆 ΟΛΟΚΛΗΡΩΘΗΚΕ!`, 'ok');
  log(`   ➕ ${created} παίκτες δημιουργήθηκαν`, 'ok');
  log(`   📋 ${historyUpdated} ιστορικά συνδέθηκαν`, 'ok');
  if (errors) log(`   ❌ ${errors} σφάλματα`, 'err');
  log('👉 Ανανέωσε το app!', 'warn');
}
