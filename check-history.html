<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Check History - Active Players</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
  h2 { color: #f0c040; }
  .ok { color: #4caf50; }
  .miss { color: #f44336; }
  .info { color: #64b5f6; }
  .warn { color: #ff9800; }
  button { background: #f0c040; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 6px; margin: 8px 4px; }
  #log { white-space: pre-wrap; line-height: 1.6; }
  .section { background: #16213e; border-radius: 8px; padding: 16px; margin: 12px 0; }
</style>
</head>
<body>
<h2>🔍 Έλεγχος Ιστορικού Ενεργών Παικτών</h2>
<div class="section">
  <button onclick="runCheck()">▶️ Εκτέλεση Ελέγχου</button>
  <button onclick="fixHistory()" id="fix-btn" style="display:none;background:#4caf50">🔧 Αντιγραφή Ιστορικού (Fix)</button>
</div>
<div id="log" class="section">Πάτα το κουμπί για να ξεκινήσει ο έλεγχος...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjcpLMBUdoTm0w2ibujwPvUXY3vwIKo_I",
  authDomain: "titans-management.firebaseapp.com",
  projectId: "titans-management",
  storageBucket: "titans-management.firebasestorage.app",
  messagingSenderId: "908542251689",
  appId: "1:908542251689:web:567d525d4b4fa7062d0fb8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let _activePlayers = [];
let _allHistoryDocs = [];
let _missingPlayers = [];

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

async function runCheck() {
  document.getElementById('log').innerHTML = '';
  _activePlayers = [];
  _allHistoryDocs = [];
  _missingPlayers = [];

  log('📥 Φόρτωση παικτών...', 'info');

  const playersSnap = await db.collection('players').get();
  const allPlayers = playersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const activePlayers = allPlayers.filter(p => p.status === 'active');
  const inactivePlayers = allPlayers.filter(p => p.status !== 'active');
  _activePlayers = activePlayers;

  log(`✅ Σύνολο παικτών: ${allPlayers.length} (ενεργοί: ${activePlayers.length}, ανενεργοί: ${inactivePlayers.length})`, 'ok');

  log('\n📥 Φόρτωση history collection...', 'info');
  const histSnap = await db.collection('history').get();
  _allHistoryDocs = histSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  log(`✅ Βρέθηκαν ${_allHistoryDocs.length} history documents`, 'ok');

  log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', '');
  log('ΕΝΕΡΓΟΙ ΠΑΙΚΤΕΣ — Έλεγχος ιστορικού:', 'warn');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n', '');

  let hasById = 0;
  let hasByName = 0;
  let missing = 0;

  for (const p of activePlayers) {
    const byId = _allHistoryDocs.find(h => h.id === p.id);
    const byName = _allHistoryDocs.find(h => {
      if (h.playerName === p.name) return true;
      if (h.records && h.records.some(r => r.playerName === p.name)) return true;
      return false;
    });

    if (byId) {
      const recs = byId.records ? byId.records.length : 0;
      log(`  ✅ ${p.name} — OK (${recs} εγγραφές)`, 'ok');
      hasById++;
    } else if (byName) {
      log(`  ⚠️  ${p.name} — history βρέθηκε με ΟΝΟΜΑ (history ID: ${byName.id} ≠ player ID: ${p.id})`, 'warn');
      hasByName++;
      _missingPlayers.push({ player: p, historyDoc: byName, needsCopy: true });
    } else {
      log(`  ❌ ${p.name} — ΔΕΝ ΒΡΕΘΗΚΕ history (player ID: ${p.id})`, 'miss');
      missing++;
      _missingPlayers.push({ player: p, historyDoc: null, needsCopy: false });
    }
  }

  log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', '');
  log(`ΣΥΝΟΨΗ:`, 'info');
  log(`  ✅ Σωστό ID: ${hasById}`, 'ok');
  log(`  ⚠️  Λάθος ID (fix possible): ${hasByName}`, 'warn');
  log(`  ❌ Χωρίς history: ${missing}`, 'miss');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n', '');

  log('\n📋 ΟΛΑ τα history document IDs:', 'info');
  for (const h of _allHistoryDocs) {
    const matchActive = activePlayers.find(p => p.id === h.id);
    const matchInactive = inactivePlayers.find(p => p.id === h.id);
    const nameInRecs = h.records?.[0]?.playerName || h.playerName || '?';
    const recCount = h.records ? h.records.length : 0;
    if (matchActive) {
      log(`  ✅ [ACTIVE]    ${h.id}  →  "${nameInRecs}" (${recCount} εγγραφές)`, 'ok');
    } else if (matchInactive) {
      log(`  📦 [inactive]  ${h.id}  →  "${nameInRecs}" / "${matchInactive.name}" (${recCount} εγγραφές)`, 'info');
    } else {
      log(`  ❓ [no match]  ${h.id}  →  "${nameInRecs}" (${recCount} εγγραφές)`, 'warn');
    }
  }

  if (_missingPlayers.filter(m => m.needsCopy).length > 0) {
    log('\n🔧 Βρέθηκαν παίκτες με history σε λάθος ID — πάτα Fix!', 'warn');
    document.getElementById('fix-btn').style.display = 'inline-block';
  }
}

async function fixHistory() {
  const toFix = _missingPlayers.filter(m => m.needsCopy && m.historyDoc);
  if (toFix.length === 0) {
    log('\n⚠️ Δεν υπάρχουν για διόρθωση', 'warn');
    return;
  }

  log('\n🔧 ΞΕΚΙΝΑΕΙ ΔΙΟΡΘΩΣΗ...', 'warn');

  for (const { player, historyDoc } of toFix) {
    try {
      const newData = { ...historyDoc };
      delete newData.id;
      await db.collection('history').doc(player.id).set(newData);
      log(`  ✅ ${player.name}: αντιγράφηκε → ${player.id}`, 'ok');
    } catch(e) {
      log(`  ❌ ${player.name}: ΣΦΑΛΜΑ — ${e.message}`, 'miss');
    }
  }

  log('\n✅ Ολοκληρώθηκε! Ανανέωσε την εφαρμογή και έλεγξε τις καρτέλες.', 'ok');
}
</script>
</body>
</html>
