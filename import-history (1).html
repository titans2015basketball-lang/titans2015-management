function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// Normalize Greek text for matching
function norm(s) {
  return s.toLowerCase().trim()
    .replace(/\s+/g,' ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z ]/g,'');
}

function detectSeason(date) {
  if (!date || date==='nan') return 'Άγνωστο';
  const y = parseInt(date.substring(0,4));
  const m = parseInt(date.substring(5,7));
  const sy = m >= 9 ? y : y-1;
  return sy + '-' + String(sy+1).slice(-2);
}

function detectType(desc) {
  const d = (desc||'').toLowerCase();
  const types = [];
  if (d.includes('πρωτ') || d.includes('prot')) types.push('πρωτάθλημα');
  if (d.includes('κυπελ') || d.includes('κυπ') || d.includes('cup')) types.push('κύπελλο');
  if (d.includes('δελτ')) types.push('δελτίο');
  if (d.includes('εμφαν') || d.includes('warm')) types.push('εμφάνιση');
  if (d.includes('φουτ') || d.includes('φούτ')) types.push('φούτερ');
  if (d.includes('summer')) types.push('summer');
  return types.join(',') || 'άλλο';
}

async function startImport() {
  document.getElementById('btn').disabled = true;
  log('🚀 Φόρτωση παικτών από Firebase...', 'info');

  // 1. Load all existing players from Firebase
  const snap = await db.collection('players').get();
  const existingPlayers = snap.docs.map(d => ({ id: d.id, name: d.data().name||'' }));
  log(`📋 Βρέθηκαν ${existingPlayers.length} παίκτες στο Firebase`, 'info');

  // Build normalized lookup
  const playerLookup = {};
  existingPlayers.forEach(p => { playerLookup[norm(p.name)] = p.id; });

  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
  log('📥 Εισαγωγή ιστορικού...', 'info');

  let matched=0, created=0, errors=0, totalRecords=0;

  for (const [histName, payments] of Object.entries(HISTORY)) {
    try {
      const normName = norm(histName);
      let playerId = null;

      // Try exact match
      if (playerLookup[normName]) {
        playerId = playerLookup[normName];
        matched++;
      } else {
        // Try partial match (last name first word)
        const parts = normName.split(' ');
        for (const [pnorm, pid] of Object.entries(playerLookup)) {
          const pparts = pnorm.split(' ');
          if (parts[0] === pparts[0] && parts.length > 1 && pparts.length > 1 && parts[1] === pparts[1]) {
            playerId = pid;
            matched++;
            break;
          }
        }
        // Try last name only
        if (!playerId) {
          for (const [pnorm, pid] of Object.entries(playerLookup)) {
            const pparts = pnorm.split(' ');
            if (parts[0] === pparts[0]) {
              playerId = pid;
              matched++;
              break;
            }
          }
        }
      }

      // If still not found, create new player
      if (!playerId) {
        playerId = uid();
        await db.collection('players').doc(playerId).set({
          name: histName.trim(),
          jersey: '',
          status: 'inactive',
          phone: '',
          email: ''
        });
        playerLookup[normName] = playerId;
        created++;
        log(`  ➕ Νέος παίκτης: ${histName.trim()}`, 'warn');
      }

      // Build history record
      const records = payments.map(p => ({
        date: p.date,
        amount: p.amount,
        description: p.description,
        season: detectSeason(p.date),
        type: detectType(p.description)
      }));

      const totalAmt = records.reduce((s,r) => s + (r.amount||0), 0);

      await db.collection('history').doc(playerId).set({
        playerId,
        playerName: histName.trim(),
        totalAmount: totalAmt,
        lastUpdated: new Date().toISOString(),
        records
      });

      totalRecords += records.length;
      log(`✅ ${histName.trim()} — ${records.length} εγγρ. | ${totalAmt.toFixed(0)}€`, 'ok');

    } catch(e) {
      errors++;
      log(`❌ ${histName}: ${e.message}`, 'err');
    }
  }

  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
  log(`🏆 ΟΛΟΚΛΗΡΩΘΗΚΕ!`, 'ok');
  log(`   ✅ ${matched} παίκτες συνδέθηκαν με Firebase ID`, 'ok');
  log(`   ➕ ${created} νέοι παίκτες δημιουργήθηκαν`, 'warn');
  log(`   📊 ${totalRecords} εγγραφές ιστορικού αποθηκεύτηκαν`, 'ok');
  if (errors) log(`   ❌ ${errors} σφάλματα`, 'err');
  log('', 'info');
  log('👉 Άνοιξε το app → Παίκτες → κλικ σε παίκτη!', 'warn');
}
